name: Compile Verify

on:
  workflow_dispatch:
    inputs:
      selected_files:
        description: "Files selected from UI (newline separated)"
        required: false
        type: string
  pull_request:
    branches: [ main ]

jobs:
  compile-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build mcp-client
        working-directory: Transcripts_final/Transcripts/mcp-client
        run: |
          npm ci
          npm run build --if-present

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python app
        working-directory: Transcripts_final/Transcripts
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m py_compile app.py

      - name: Print selected files input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Selected files from UI:"
          echo "${{ inputs.selected_files }}"